<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません - ヌリエル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Zen Maru Gothic',sans-serif;color:#3d2c29;background:#fef7f4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    .code{font-size:clamp(5rem,15vw,8rem);font-weight:700;color:#f5d5c8;line-height:1}
    h1{font-size:1.4rem;font-weight:700;margin:16px 0 12px}
    p{font-size:0.95rem;color:#8b6f66;line-height:1.8;margin-bottom:32px}
    .btn{display:inline-block;background:#D2735C;color:#fff;font-size:0.9rem;font-weight:600;padding:14px 36px;border-radius:12px;text-decoration:none;transition:opacity 0.2s}
    .btn:hover{opacity:0.85}
    .footer{position:fixed;bottom:16px;font-size:0.72rem;color:#c4a99e}
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動または削除された可能性があります。<br>URLをご確認ください。</p>
  <a href="/" class="btn" aria-label="トップページへ戻る">トップページへ戻る</a>
  <div class="footer">&copy; 2026 ヌリエル</div>
</body>
</html>
