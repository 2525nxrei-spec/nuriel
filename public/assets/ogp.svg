<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2735C"/>
      <stop offset="100%" stop-color="#b85a45"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装飾 -->
  <circle cx="200" cy="500" r="200" fill="#e8956e" opacity="0.12"/>
  <circle cx="1000" cy="130" r="240" fill="#e8956e" opacity="0.08"/>
  <!-- パレット＆筆アイコン -->
  <g transform="translate(600, 190)">
    <!-- パレット -->
    <ellipse cx="-10" cy="0" rx="45" ry="35" fill="none" stroke="#fcd5ce" stroke-width="4"/>
    <!-- パレットの穴 -->
    <circle cx="-30" cy="-5" r="6" fill="#fcd5ce" opacity="0.5"/>
    <!-- 色の点 -->
    <circle cx="5" cy="-15" r="5" fill="#ffb3b3"/>
    <circle cx="20" cy="-5" r="5" fill="#ffd6a5"/>
    <circle cx="15" cy="15" r="5" fill="#a0c4ff"/>
    <circle cx="-5" cy="20" r="5" fill="#caffbf"/>
    <!-- 筆 -->
    <line x1="30" y1="-30" x2="50" y2="-50" stroke="#fcd5ce" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="-50" x2="55" y2="-55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- サービス名 -->
  <text x="600" y="340" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="80" font-weight="bold" fill="#ffffff" letter-spacing="8">ヌリエル</text>
  <!-- キャッチコピー -->
  <text x="600" y="410" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="30" fill="#fcd5ce">うちの子を、ぬりえに。</text>
  <!-- 下部ライン -->
  <rect x="500" y="460" width="200" height="3" rx="2" fill="#fcd5ce" opacity="0.5"/>
  <!-- 会社名 -->
  <text x="600" y="560" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="18" fill="#fcd5ce" opacity="0.6">株式会社 礼</text>
</svg>